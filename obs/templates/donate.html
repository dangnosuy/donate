<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --widget-height: 48px;
            --widget-width: 450px;
            --corner-cut: 15px;
            --label-width: 140px;
            --month-glow-color: #00d4ff;
            --month-glow-rgb: 0, 212, 255;
            --all-time-glow-color: #c57aff;
            --all-time-glow-rgb: 209, 122, 255;
            --label-bg: #1a1d26;
            --scroller-bg: rgba(33, 37, 48, 0.9);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: transparent;
        }

        .modern-widget {
            position: absolute;
            height: var(--widget-height);
            width: var(--widget-width);
            transform-origin: top left;
        }
        
        #widget-month { 
            top: 20px; left: 20px;
            filter: drop-shadow(0 0 8px rgba(var(--month-glow-rgb), 0.7));
        }
        #widget-all-time { 
            top: 85px; left: 20px;
            filter: drop-shadow(0 0 8px rgba(var(--all-time-glow-rgb), 0.7));
        }

        .widget-body {
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            clip-path: polygon(
                var(--corner-cut) 0, calc(100% - var(--corner-cut)) 0, 
                100% var(--corner-cut), 100% calc(100% - var(--corner-cut)), 
                calc(100% - var(--corner-cut)) 100%, var(--corner-cut) 100%, 
                0 calc(100% - var(--corner-cut)), 0 var(--corner-cut)
            );
            border: 1px solid;
        }
        
        #widget-month .widget-body {
             border-color: rgba(var(--month-glow-rgb), 0.7);
             box-shadow: inset 0 0 1.5px rgba(255, 255, 255, 0.7);
        }
        #widget-all-time .widget-body {
             border-color: rgba(var(--all-time-glow-rgb), 0.7);
             box-shadow: inset 0 0 1.5px rgba(255, 255, 255, 0.7);
        }

        .widget-label {
            display: flex; align-items: center; justify-content: center;
            width: var(--label-width); height: 100%; flex-shrink: 0;
            background-color: var(--label-bg); color: #fff;
            font-family: 'Exo 2', sans-serif;
            font-size: 17px; font-weight: 700;
            border-right: 2px solid;
        }
        #widget-month .widget-label {
            text-shadow: 0 0 12px var(--month-glow-color);
            border-right-color: rgba(var(--month-glow-rgb), 0.5);
        }
        #widget-all-time .widget-label {
            text-shadow: 0 0 12px var(--all-time-glow-color);
            border-right-color: rgba(var(--all-time-glow-rgb), 0.5);
        }
        
        .widget-scroller {
            position: relative; flex-grow: 1; display: flex; align-items: center;
            background-color: var(--scroller-bg); backdrop-filter: blur(5px);
            overflow: hidden;
        }
        .widget-scroller::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient( to right, var(--scroller-bg) 0%, transparent 15%, transparent 85%, var(--scroller-bg) 100% );
        }
        .scrolling-content { display: flex; align-items: center; white-space: nowrap; }
        .donor-item { display: inline-flex; align-items: center; margin: 0 20px; color: #d1d5db; }
        
        /* --- CSS ĐƯỢC CHỈNH SỬA Ở ĐÂY --- */
        .donor-amount { 
            font-family: 'Exo 2', sans-serif;
            font-size: 16px; 
            font-weight: 500; 
            color: #ffc857; /* Thêm màu vàng gold */
            text-shadow: 0 0 5px rgba(255, 200, 87, 0.6); /* Thêm hiệu ứng glow nhẹ */
        }
        .donor-name { 
            font-size: 16px; 
            font-weight: 700; /* Tăng độ đậm */
            margin-right: 12px; 
            color: #ffffff; /* Cho màu trắng sáng để nổi bật */
        }
        /* --- KẾT THÚC PHẦN CHỈNH SỬA --- */

        .donor-icon { font-size: 20px; margin: 0 12px; filter: drop-shadow(0 0 5px currentColor); }
        #widget-month .donor-icon { color: var(--month-glow-color); }
        #widget-all-time .donor-icon { color: var(--all-time-glow-color); }
        
        @keyframes slideInfinite { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .draggable { cursor: move; user-select: none; position: relative; }
        .draggable.dragging { z-index: 1000; }
        .resize-controls {
            position: absolute; top: -30px; right: 0; background: rgba(0, 0, 0, 0.8);
            border-radius: 15px; padding: 5px 10px; display: flex; gap: 5px;
            opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 15;
        }
        .draggable:hover .resize-controls { opacity: 1; visibility: visible; }
        .resize-btn {
            background: #2563eb; color: white; border: none; border-radius: 50%;
            width: 20px; height: 20px; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease;
        }
        .resize-btn:hover { background: #1d4ed8; }
        .resize-btn.plus { background: #16a34a; }
        .resize-btn.plus:hover { background: #15803d; }
        .resize-btn.minus { background: #dc2626; }
        .resize-btn.minus:hover { background: #b91c1c; }

        #alert {
            position: absolute; bottom: 30px; right: 30px; max-width: 700px;
            color: #ffffff; font-size: 20px; font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0; transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            line-height: 1.5; font-family: 'Montserrat', sans-serif;
            transform-origin: top left;
        }
        #alert.positioned { transform-origin: top left; }
        #alert.show { transform: translateX(0); opacity: 1; }
        #alert.hide { transform: translateX(100%); opacity: 0; }
        #alert.dragging { transition: none !important; transform: none !important; opacity: 1 !important; }
        #alert.show.positioned { transform: none; }
        #alert .donor-name {
            background: linear-gradient(45deg, #ffffff, #f0f8ff, #ffffff);
            background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            animation: nameShine 2s ease-in-out infinite; display: inline;
            font-size: 26px; font-weight: 700; text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }
        @keyframes nameShine { 0%, 100% { background-position: 0% 50%; transform: scale(1); } 50% { background-position: 100% 50%; transform: scale(1.05); } }
        .donation-amount {
            background: linear-gradient(45deg, #ffffff, #fff700, #ffffff);
            background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            animation: amountGlow 1.5s ease-in-out infinite; display: inline;
            font-size: 26px; font-weight: 700; margin: 0 8px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }
        @keyframes amountGlow { 0%, 100% { background-position: 0% 50%; text-shadow: 0 0 20px rgba(255, 255, 255, 0.9); } 50% { background-position: 100% 50%; text-shadow: 0 0 30px rgba(255, 247, 0, 0.9); } }
        .donation-message {
            color: #ffffff; font-style: italic; animation: messageFloat 3s ease-in-out infinite;
            display: inline; font-size: 20px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 15px rgba(255, 255, 255, 0.8);
        }
        @keyframes messageFloat { 0%, 100% { opacity: 0.9; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
        .regular-text { color: #ffffff; display: inline; font-size: 20px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); }
        .emoji { display: inline-block; animation: emojiSpin 2s ease-in-out infinite; margin: 0 5px; font-size: 24px; }
        @keyframes emojiSpin { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(10deg) scale(1.1); } }
        .sparkle { position: absolute; color: #60a5fa; font-size: 16px; pointer-events: none; animation: sparkleFloat 2s ease-out forwards; opacity: 0; }
        @keyframes sparkleFloat { 0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); } 100% { opacity: 0; transform: translateY(-80px) scale(0.5) rotate(360deg); } }
        .pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.8); } 50% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.9), 0 0 60px rgba(255, 255, 255, 0.7); } }
        .position-indicator {
            position: fixed; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.7);
            color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 1001; display: none;
        }
        .queue-indicator {
            position: fixed; bottom: 10px; left: 10px; background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; z-index: 1001;
            border: 1px solid #60a5fa; box-shadow: 0 0 10px rgba(96, 165, 250, 0.3); display: none;
        }
        .queue-indicator.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="position-indicator" class="position-indicator"></div>
    <div id="queue-indicator" class="queue-indicator" style="display: none;">
        <span id="queue-count">0</span> donation đang chờ
    </div>

    <div id="widget-month" class="draggable modern-widget" draggable="true">
        <div class="resize-controls">
            <button class="resize-btn plus" onclick="resizeElement('widget-month', 1.1)">+</button>
            <button class="resize-btn minus" onclick="resizeElement('widget-month', 0.9)">-</button>
            <button class="resize-btn" onclick="resetSize('widget-month')">↻</button>
        </div>
        <div class="widget-body">
            <div class="widget-label">TOP THÁNG</div>
            <div id="scroller-month" class="widget-scroller"></div>
        </div>
    </div>

    <div id="widget-all-time" class="draggable modern-widget" draggable="true">
        <div class="resize-controls">
            <button class="resize-btn plus" onclick="resizeElement('widget-all-time', 1.1)">+</button>
            <button class="resize-btn minus" onclick="resizeElement('widget-all-time', 0.9)">-</button>
            <button class="resize-btn" onclick="resetSize('widget-all-time')">↻</button>
        </div>
        <div class="widget-body">
            <div class="widget-label">TOP CỨNG</div>
            <div id="scroller-all-time" class="widget-scroller"></div>
        </div>
    </div>

    <div id="alert" class="pulse-glow draggable" draggable="true">
        <div class="resize-controls" style="top: -35px; right: -10px;">
            <button class="resize-btn plus" onclick="resizeElement('alert', 1.1)">+</button>
            <button class="resize-btn minus" onclick="resizeElement('alert', 0.9)">-</button>
            <button class="resize-btn" onclick="resetSize('alert')">↻</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        const scrollerMonth = document.getElementById("scroller-month");
        const scrollerAllTime = document.getElementById("scroller-all-time");
        const alertBox = document.getElementById("alert");
        const positionIndicator = document.getElementById("position-indicator");
        const queueIndicator = document.getElementById("queue-indicator");
        const queueCount = document.getElementById("queue-count");
        const socket = io("http://14.225.253.242:3001/");

        const donationQueue = [];
        let isProcessing = false;
        let currentAudio = null;
        let currentAudioTimeout = null;
        let alertManuallyPositioned = false;
        const elementScales = { 'widget-month': 1, 'widget-all-time': 1, 'alert': 1 };

        function updateQueueIndicator() {
            const queueLength = donationQueue.length;
            queueCount.textContent = queueLength;
            queueIndicator.classList.toggle('show', queueLength > 0);
        }
        
        let draggedElement = null, dragOffset = { x: 0, y: 0 };
        function makeDraggable(element) {
            element.addEventListener('mousedown', startDrag);
            element.addEventListener('touchstart', startDrag, { passive: false });
        }

        function startDrag(e) {
            if (e.target.classList.contains('resize-btn') || e.target.closest('.resize-controls')) return;
            e.preventDefault();
            draggedElement = e.currentTarget;
            draggedElement.classList.add('dragging');
            if (draggedElement.id === 'alert') {
                alertManuallyPositioned = true;
                draggedElement.classList.add('positioned');
            }
            const rect = draggedElement.getBoundingClientRect();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            dragOffset = { x: clientX - rect.left, y: clientY - rect.top };
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('touchend', stopDrag);
            positionIndicator.style.display = 'block';
        }
        function drag(e) {
            if (!draggedElement) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const x = clientX - dragOffset.x;
            const y = clientY - dragOffset.y;
            draggedElement.style.left = x + 'px';
            draggedElement.style.top = y + 'px';
            if (draggedElement.id === 'alert') {
                 draggedElement.style.bottom = 'auto';
                 draggedElement.style.right = 'auto';
            }
            const currentScale = elementScales[draggedElement.id] || 1;
            positionIndicator.textContent = `Vị trí: ${Math.round(x)}, ${Math.round(y)} | Tỉ lệ: ${currentScale.toFixed(2)}`;
        }
        function stopDrag() {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            }
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('touchend', stopDrag);
            setTimeout(() => { positionIndicator.style.display = 'none'; }, 2000);
        }

        function resizeElement(elementId, scaleFactor) {
            const element = document.getElementById(elementId);
            const currentScale = elementScales[elementId] || 1;
            const newScale = currentScale * scaleFactor;
            if (newScale >= 0.3 && newScale <= 3) {
                elementScales[elementId] = newScale;
                element.style.transform = `scale(${newScale})`;
            }
        }
        function resetSize(elementId) {
            elementScales[elementId] = 1;
            document.getElementById(elementId).style.transform = 'scale(1)';
        }

        function formatCurrency(amount) { return new Intl.NumberFormat('vi-VN').format(amount) + 'đ'; }
        function createSlidingDonors(donors, isAllTime = false) {
            if (!donors || donors.length === 0) return '<div style="padding-left: 25px; font-size: 14px; color: #aaa;">Chưa có người ủng hộ</div>';
            const monthRankIcons = ['🥇', '🥈', '🥉', '🏆', '🏅'];
            const allTimeRankIcons = ['👑', '💎', '🌟', '⭐', '✨'];
            const icons = isAllTime ? allTimeRankIcons : monthRankIcons;
            const donorItems = donors.map((donor, index) => {
                const icon = icons[index] || icons[icons.length - 1]; 
                // Thứ tự đã được sửa lại ở đây: Icon - Tên - Số tiền
                return `<div class="donor-item"><span class="donor-icon">${icon}</span><span class="donor-name">${donor.username}</span><span class="donor-amount">${formatCurrency(donor.total_amount)}</span></div>`
            }).join('');
            const fullContent = donorItems + donorItems;
            const duration = donors.length * 8;
            const animationStyle = `animation: slideInfinite ${duration}s linear infinite;`;
            return `<div class="scrolling-content" style="${animationStyle}">${fullContent}</div>`;
        }
        async function fetchTopDonors() {
            try {
                const response = await fetch('https://generate-qr.flydigivietnam.com/api/top-5-donors');
                const data = await response.json();
                scrollerMonth.innerHTML = createSlidingDonors(data.top_donors, false);
            } catch (error) { scrollerMonth.innerHTML = '<div style="padding-left: 25px; color: #ff5555;">Lỗi kết nối</div>'; }
        }
        async function fetchTopDonorsAllTime() {
            try {
                const response = await fetch('https://generate-qr.flydigivietnam.com/api/top-5-donors-all-time');
                const data = await response.json();
                scrollerAllTime.innerHTML = createSlidingDonors(data.top_donors, true);
            } catch (error) { scrollerAllTime.innerHTML = '<div style="padding-left: 25px; color: #ff5555;">Lỗi kết nối</div>'; }
        }

        function createSparkles() {
            const sparkleEmojis = ['✨', '⭐', '💫', '🌟', '💎'];
            const alertRect = alertBox.getBoundingClientRect();
            if (alertRect.width === 0 && alertRect.height === 0) return;
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                sparkle.style.left = (alertRect.left + Math.random() * alertRect.width) + 'px';
                sparkle.style.top = (alertRect.top + Math.random() * alertRect.height) + 'px';
                sparkle.style.animationDelay = Math.random() * 1 + 's';
                document.body.appendChild(sparkle);
                setTimeout(() => { document.body.contains(sparkle) && document.body.removeChild(sparkle); }, 2000);
            }
        }
        function showDonationAlert(data) {
            const donorName = `<span class="donor-name">${data.username}</span>`;
            const amount = `<span class="donation-amount">${formatCurrency(data.amount)}</span>`;
            const message = data.message ? `<span class="donation-message">"${data.message}"</span>` : '<span class="donation-message">❤️</span>';
            alertBox.innerHTML = `<div style="text-align: center;"><span class="regular-text">🎉</span> ${donorName} <span class="regular-text"> đã donate </span> ${amount} <span class="emoji">💰</span></div><div style="text-align: center; margin-top: 0.8rem;"><span style="display: inline-block; font-style: italic;">${message}</span> <span class="emoji">✨</span></div>`;
            const scale = elementScales['alert'] || 1;
            alertBox.style.transform = `scale(${scale})`;
            alertBox.classList.remove('hide');
            alertBox.classList.add('show');
        }
        function hideDonationAlert() {
            alertBox.classList.remove('show');
            alertBox.classList.add('hide');
            setTimeout(processNextDonation, 800);
        }
        async function processDonation(data) {
             try {
                const text = data.message ? `"${data.message}"` : "Cảm ơn bạn đã donate";
                const voice = data.voice || "default";
                const response = await fetch("/read", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, voice }) });
                if (!response.ok) throw new Error('TTS service failed');
                const audioData = await response.json();
                createSparkles();
                showDonationAlert(data);
                currentAudio = new Audio(audioData.url);
                currentAudio.play();
                currentAudio.addEventListener('ended', () => {
                    currentAudio = null; isProcessing = false;
                    currentAudioTimeout = setTimeout(() => { hideDonationAlert(); fetchTopDonors(); fetchTopDonorsAllTime(); }, 2000);
                });
                currentAudio.addEventListener('error', (e) => {
                    console.error('Audio playback error:', e); currentAudio = null; isProcessing = false;
                    currentAudioTimeout = setTimeout(hideDonationAlert, 8000);
                });
            } catch (error) {
                console.error('Error processing donation:', error); isProcessing = false;
                createSparkles(); showDonationAlert(data);
                currentAudioTimeout = setTimeout(hideDonationAlert, 8000);
            }
        }
        function processNextDonation() {
            if (donationQueue.length > 0 && !isProcessing && !currentAudio) {
                isProcessing = true;
                const nextDonation = donationQueue.shift();
                updateQueueIndicator();
                processDonation(nextDonation);
            }
        }
        function handleNewDonation(data) {
            if (isProcessing || currentAudio) { donationQueue.push(data); updateQueueIndicator(); } 
            else { isProcessing = true; processDonation(data); }
        }
        
        socket.on("donation", handleNewDonation);
        document.querySelectorAll('.draggable').forEach(makeDraggable);
        fetchTopDonors();
        fetchTopDonorsAllTime();
        setInterval(fetchTopDonors, 300000);
        setInterval(fetchTopDonorsAllTime, 300000);
    </script>
</body>
</html>
